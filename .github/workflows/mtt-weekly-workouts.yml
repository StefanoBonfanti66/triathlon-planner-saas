name: MTT Weekly Workouts - Send Sunday 20:00

on:
  schedule:
    # GitHub cron è UTC-only e non segue il DST. Due run domenicali:
    # - 18:00 UTC = 20:00 CEST (estate)
    # - 19:00 UTC = 20:00 CET (inverno)
    # La run "sbagliata" è un no-op: il record è già stato inviato dall'altra
    # (status='sent') e la query cerca solo status='approved'.
    - cron: '0 18 * * 0'
    - cron: '0 19 * * 0'
  workflow_dispatch: # Permette invio manuale per test

permissions:
  contents: read

jobs:
  send-workouts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: app
        run: npm ci

      - name: Send approved MTT workouts
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT: ${{ github.event_name }}
        run: |
          node << 'SCRIPT'
          const { createClient } = require('@supabase/supabase-js');

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { persistSession: false } }
          );

          async function sendApproved() {
            const now = new Date();

            // Le due cron (18:00 e 19:00 UTC) coprono CEST e CET, ma va
            // inviato solo quando in Italia sono almeno le 20:00: la run
            // fuori stagione esce senza fare nulla.
            const romeHour = Number(
              new Intl.DateTimeFormat('en-US', {
                timeZone: 'Europe/Rome',
                hour: 'numeric',
                hour12: false,
              }).format(now)
            );
            // Solo per il cron: il workflow_dispatch manuale può inviare
            // in qualsiasi momento (serve per i test).
            if (process.env.GITHUB_EVENT === 'schedule' && romeHour < 20) {
              console.log(`It's ${romeHour}:00 in Rome — waiting for the 20:00 run`);
              return;
            }

            const year = now.getFullYear();
            const weekNumber = Math.ceil((now - new Date(year, 0, 1)) / (7 * 24 * 60 * 60 * 1000));

            console.log(`Checking workouts for week ${weekNumber}/${year}`);

            const { data: workouts, error } = await supabase
              .from('team_workouts')
              .select('*')
              .eq('team_id', 'mtt')
              .eq('year', year)
              .eq('week_number', weekNumber)
              .eq('status', 'approved');

            if (error) {
              console.error('Error:', error);
              process.exit(1);
            }

            if (!workouts || workouts.length === 0) {
              console.log('No approved workouts to send');
              return;
            }

            for (const workout of workouts) {
              console.log(`Sending workout ${workout.id}`);
              const { data, error: sendError } = await supabase.functions.invoke('mtt-weekly-workouts', {
                body: { action: 'send', workout_id: workout.id }
              });

              if (sendError) {
                console.error('Send error:', sendError);
                await supabase.from('team_workouts').update({ status: 'error' }).eq('id', workout.id);
                process.exitCode = 1;
              } else {
                console.log('Sent successfully:', data);
              }
            }
          }

          sendApproved();
          SCRIPT
